<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pul Hisobi</title>
<style>
/* Layout: telefon ilovasi — tepada oylik balans kartasi, o'rtada yozuvlar ro'yxati yoki statistika, pastda 2 bo'limli menyu va + tugmasi */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --surface-2:#e7ebe5; --fg:#17201a; --muted:#5f6b62; --line:#d7ddd5;
  --accent:#0f6b4a; --accent-fg:#ffffff; --in:#14804f; --out:#c2412d; --in-soft:#dff1e7; --out-soft:#f9e3de;
  --c-salary:#14804f; --c-biz:#2d5fb8; --c-yt:#d93a2b; --c-family:#b7791f; --c-personal:#7b4fb3;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 10px 30px rgba(15,40,25,.14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#17201b; --surface-2:#1f2a24; --fg:#e6eee8; --muted:#97a69c; --line:#2b3830;
  --accent:#3fbf8a; --accent-fg:#0e1411; --in:#4ccb8e; --out:#f0806c; --in-soft:#173527; --out-soft:#3a1f1a;
  --c-salary:#4ccb8e; --c-biz:#6f9cf0; --c-yt:#f06a5c; --c-family:#e3a94a; --c-personal:#b08ae6;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#17201b; --surface-2:#1f2a24; --fg:#e6eee8; --muted:#97a69c; --line:#2b3830;
  --accent:#3fbf8a; --accent-fg:#0e1411; --in:#4ccb8e; --out:#f0806c; --in-soft:#173527; --out-soft:#3a1f1a;
  --c-salary:#4ccb8e; --c-biz:#6f9cf0; --c-yt:#f06a5c; --c-family:#e3a94a; --c-personal:#b08ae6;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 150px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* balans kartasi */
.hero{background:var(--accent);color:var(--accent-fg);border-radius:22px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.hero .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px;overflow-wrap:anywhere}
.hero .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .box{background:rgba(255,255,255,.14);border-radius:14px;padding:9px 12px;min-width:0}
.hero .box small{display:block;font-size:12px;opacity:.85}
.hero .box b{font-size:18px;overflow-wrap:anywhere}

h2.sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;font-weight:700}
.chips{display:flex;gap:6px;margin:16px 0 4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* yozuvlar */
.day{margin-top:16px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px;font-size:13px;color:var(--muted);font-weight:600}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;background:transparent;width:100%;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--surface-2)}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mid{min-width:0}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--in)} .amt.out{color:var(--out)}
.empty{text-align:center;padding:36px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:18px;margin-top:16px}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}

/* statistika */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.period{display:flex;align-items:center;justify-content:space-between;margin:14px 0 12px}
.period b{font-size:17px}
.nav{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.nav:disabled{opacity:.35;cursor:default}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.card small{display:block;font-size:12px;color:var(--muted)}
.card b{display:block;font-size:15px;overflow-wrap:anywhere}
.card .d{font-size:12px;margin-top:2px}
.up{color:var(--in)} .down{color:var(--out)} .flat{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.rank{display:grid;grid-template-columns:22px 1fr auto;gap:4px 10px;align-items:center}
.rank+.rank{margin-top:12px}
.rank .n{font-weight:800;color:var(--muted);font-size:14px;grid-row:span 2}
.rank .nm{font-weight:600;min-width:0}
.rank .v{font-weight:700;text-align:right;white-space:nowrap}
.bar{grid-column:2/4;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.rank .p{color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
.none{color:var(--muted);font-size:14px}
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;padding-top:6px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bars{display:flex;gap:3px;align-items:flex-end;height:130px;width:100%;justify-content:center;border-bottom:1px solid var(--line)}
.bars i{width:40%;max-width:16px;border-radius:4px 4px 0 0;min-height:2px}
.col small{font-size:11px;color:var(--muted);white-space:nowrap}
.col.cur small{color:var(--fg);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.best{margin-top:12px;font-size:13px;color:var(--muted)}
.best b{color:var(--fg)}

/* pastki menyu */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;height:64px}
.tabbar button.t{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600;padding:6px}
.tabbar button.t svg{width:24px;height:24px}
.tabbar button.t[aria-selected="true"]{color:var(--accent)}
.fab{width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin:-26px auto 0;box-shadow:var(--shadow)}
.fab svg{width:28px;height:28px}

/* forma */
.scrim{position:fixed;inset:0;background:rgba(5,15,10,.5);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow);max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.type{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px;margin-bottom:14px}
.type button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:700;color:var(--muted)}
.type button[aria-pressed="true"][data-t="in"]{background:var(--in);color:#fff}
.type button[aria-pressed="true"][data-t="out"]{background:var(--out);color:#fff}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding:4px 2px 8px;margin-bottom:14px}
.amount:focus-within{border-color:var(--accent)}
.amount input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:34px;font-weight:800;color:var(--fg);outline:none;font-variant-numeric:tabular-nums}
.amount span{font-size:16px;color:var(--muted);font-weight:600}
.lab{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.cat{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;display:flex;align-items:center;gap:8px;font-weight:600;text-align:left}
.cat[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.cat em{font-style:normal;font-size:18px}
.fields{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-bottom:6px}
.fields label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.fields input{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.err{color:var(--out);font-size:13px;min-height:1.2em;margin:4px 0}
.acts{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface-2)}
.btn.danger{background:var(--out-soft);color:var(--out);flex:0 0 auto;padding-inline:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;z-index:40;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ASOSIY -->
  <section id="v-home">
    <div class="hero">
      <div class="lbl" id="h-month"></div>
      <div class="big num" id="h-bal"></div>
      <div class="row">
        <div class="box"><small>⬆ Kirim</small><b class="num" id="h-in"></b></div>
        <div class="box"><small>⬇ Chiqim</small><b class="num" id="h-out"></b></div>
      </div>
    </div>
    <div class="chips" role="group" aria-label="Filtr">
      <button class="chip" data-f="all" aria-pressed="true">Hammasi</button>
      <button class="chip" data-f="in" aria-pressed="false">Kirim</button>
      <button class="chip" data-f="out" aria-pressed="false">Chiqim</button>
    </div>
    <div id="list"></div>
  </section>

  <!-- STATISTIKA -->
  <section id="v-stats" hidden>
    <div class="seg" role="group" aria-label="Davr">
      <button data-p="week" aria-pressed="false">Haftalik</button>
      <button data-p="month" aria-pressed="true">Oylik</button>
    </div>
    <div class="period">
      <button class="nav" id="p-prev" aria-label="Oldingi davr">‹</button>
      <b id="p-label"></b>
      <button class="nav" id="p-next" aria-label="Keyingi davr">›</button>
    </div>
    <div class="cards">
      <div class="card"><small>Kirim</small><b class="num up" id="s-in"></b><div class="d num" id="s-in-d"></div></div>
      <div class="card"><small>Chiqim</small><b class="num down" id="s-out"></b><div class="d num" id="s-out-d"></div></div>
      <div class="card"><small>Qoldiq</small><b class="num" id="s-bal"></b><div class="d num" id="s-bal-d"></div></div>
    </div>
    <h2 class="sec">Daromad manbalari reytingi</h2>
    <div class="panel" id="r-in"></div>
    <h2 class="sec">Xarajatlar reytingi</h2>
    <div class="panel" id="r-out"></div>
    <h2 class="sec" id="trend-title"></h2>
    <div class="panel">
      <div class="chart" id="chart"></div>
      <div class="legend"><span style="--c:var(--in)">Kirim</span><span style="--c:var(--out)">Chiqim</span></div>
      <div class="best" id="best"></div>
    </div>
  </section>
</div>

<nav class="tabbar">
  <div class="in">
    <button class="t" data-v="home" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Yozuvlar
    </button>
    <button class="fab" id="add" aria-label="Yangi yozuv qo'shish">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="t" data-v="stats" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Statistika
    </button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<form class="sheet" id="sheet" hidden autocomplete="off">
  <div class="grab"></div>
  <div class="type" role="group" aria-label="Turi">
    <button type="button" data-t="in" aria-pressed="true">⬆ Kirim</button>
    <button type="button" data-t="out" aria-pressed="false">⬇ Chiqim</button>
  </div>
  <div class="amount"><input id="f-amt" inputmode="numeric" placeholder="0" aria-label="Summa"><span>so'm</span></div>
  <div class="lab" id="cat-lab">Qayerdan keldi?</div>
  <div class="cats" id="cats"></div>
  <div class="fields">
    <label for="f-date">Sana<input type="date" id="f-date"></label>
    <label for="f-note">Izoh<input type="text" id="f-note" maxlength="80" placeholder="ixtiyoriy"></label>
  </div>
  <div class="err" id="f-err"></div>
  <div class="acts">
    <button type="button" class="btn danger" id="f-del" hidden>O'chirish</button>
    <button type="button" class="btn ghost" id="f-cancel">Bekor</button>
    <button type="submit" class="btn primary">Saqlash</button>
  </div>
</form>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const CATS={
    in:[
      {id:"salary",name:"Oylik maosh",icon:"💼",c:"--c-salary"},
      {id:"biz",name:"Biznes",icon:"🏪",c:"--c-biz"},
      {id:"yt",name:"YouTube",icon:"▶️",c:"--c-yt"}
    ],
    out:[
      {id:"yt",name:"YouTube",icon:"▶️",c:"--c-yt"},
      {id:"biz",name:"Biznes",icon:"🏪",c:"--c-biz"},
      {id:"family",name:"Oila",icon:"🏠",c:"--c-family"},
      {id:"personal",name:"Shaxsiy",icon:"👤",c:"--c-personal"}
    ]
  };
  const MON=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
  const MONS=["yan","fev","mar","apr","may","iyn","iyl","avg","sen","okt","noy","dek"];
  const $=s=>document.querySelector(s);
  const pad=n=>String(n).padStart(2,"0");
  const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ");
  const money=n=>fmt(n)+" so'm";
  const short=n=>{const a=Math.abs(n);if(a>=1e9)return (n/1e9).toFixed(1).replace(".",",")+" mlrd";if(a>=1e6)return (n/1e6).toFixed(1).replace(".",",")+" mln";if(a>=1e3)return Math.round(n/1e3)+" ming";return fmt(n)};
  const catOf=(type,id)=>CATS[type].find(c=>c.id===id)||{name:id,icon:"•",c:"--muted"};

  // ---------- Saqlash ----------
  const LS="pul-hisobi-v1";
  let items=[];
  try{ items=JSON.parse(localStorage.getItem(LS)||"[]") }catch(e){ items=[] }
  const save=()=>{ try{ localStorage.setItem(LS,JSON.stringify(items)) }catch(e){ toast("Saqlab bo'lmadi") } };

  // ---------- Davrlar ----------
  const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x};
  function range(kind,offset){
    const now=new Date();
    if(kind==="month"){const s=new Date(now.getFullYear(),now.getMonth()+offset,1);const e=new Date(s.getFullYear(),s.getMonth()+1,1);return {s,e}}
    const s=weekStart(now);s.setDate(s.getDate()+7*offset);const e=new Date(s);e.setDate(e.getDate()+7);return {s,e};
  }
  const inRange=(it,r)=>{const d=parse(it.date);return d>=r.s&&d<r.e};
  function sums(r){
    let inc=0,out=0;const bi={},bo={};
    items.forEach(it=>{ if(!inRange(it,r)) return;
      if(it.type==="in"){inc+=it.amount;bi[it.cat]=(bi[it.cat]||0)+it.amount}
      else{out+=it.amount;bo[it.cat]=(bo[it.cat]||0)+it.amount} });
    return {inc,out,bal:inc-out,bi,bo};
  }
  function label(kind,r,shortForm){
    if(kind==="month") return shortForm?MONS[r.s.getMonth()]:`${MON[r.s.getMonth()][0].toUpperCase()+MON[r.s.getMonth()].slice(1)} ${r.s.getFullYear()}`;
    const e=new Date(r.e);e.setDate(e.getDate()-1);
    if(shortForm) return `${r.s.getDate()}.${pad(r.s.getMonth()+1)}`;
    return r.s.getMonth()===e.getMonth()?`${r.s.getDate()}–${e.getDate()} ${MON[e.getMonth()]}`:`${r.s.getDate()} ${MONS[r.s.getMonth()]} – ${e.getDate()} ${MONS[e.getMonth()]}`;
  }

  // ---------- Asosiy ekran ----------
  let filter="all";
  function renderHome(){
    const r=range("month",0), s=sums(r);
    $("#h-month").textContent=`${MON[r.s.getMonth()]} oyi qoldig'i`;
    $("#h-bal").textContent=(s.bal<0?"−":"")+money(Math.abs(s.bal));
    $("#h-in").textContent=fmt(s.inc);
    $("#h-out").textContent=fmt(s.out);
    const list=items.filter(it=>filter==="all"||it.type===filter).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
    if(!list.length){
      $("#list").innerHTML=`<div class="empty"><b>${items.length?"Bu bo'limda yozuv yo'q":"Hali yozuv yo'q"}</b>Pastdagi + tugmasini bosib, birinchi kirim yoki chiqimni kiriting.</div>`;
      return;
    }
    const groups={}; list.forEach(it=>(groups[it.date]=groups[it.date]||[]).push(it));
    const today=ymd(new Date()), yest=(()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d)})();
    $("#list").innerHTML=Object.keys(groups).slice(0,60).map(day=>{
      const g=groups[day], net=g.reduce((a,it)=>a+(it.type==="in"?it.amount:-it.amount),0);
      const d=parse(day), name=day===today?"Bugun":day===yest?"Kecha":`${d.getDate()}-${MON[d.getMonth()]}`;
      return `<div class="day"><div class="day-head"><span>${name}</span><span class="num ${net>=0?"up":"down"}">${net>=0?"+":"−"}${fmt(Math.abs(net))}</span></div>
      <div class="list">${g.map(it=>{const c=catOf(it.type,it.cat);
        return `<button class="item" data-id="${it.id}"><span class="dot" style="background:color-mix(in srgb,var(${c.c}) 16%,var(--surface))">${c.icon}</span>
        <span class="mid"><span class="t">${c.name}</span><span class="s" style="display:block">${it.type==="in"?"Kirim":"Chiqim"}${it.note?" · "+esc(it.note):""}</span></span>
        <span class="amt num ${it.type}">${it.type==="in"?"+":"−"}${fmt(it.amount)}</span></button>`}).join("")}</div></div>`;
    }).join("");
  }
  document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
    filter=b.dataset.f; document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b)); renderHome();
  }));
  $("#list").addEventListener("click",e=>{const b=e.target.closest(".item"); if(b) openSheet(items.find(x=>x.id===b.dataset.id))});

  // ---------- Statistika ----------
  let pkind="month", poff=0;
  function delta(cur,prev,goodUp){
    if(!prev&&!cur) return `<span class="flat">—</span>`;
    if(!prev) return `<span class="flat">yangi</span>`;
    const p=Math.round((cur-prev)/Math.abs(prev)*100);
    if(p===0) return `<span class="flat">0%</span>`;
    const good=goodUp?p>0:p<0;
    return `<span class="${good?"up":"down"}">${p>0?"▲":"▼"} ${Math.abs(p)}%</span>`;
  }
  function rankHTML(type,map,total){
    const rows=CATS[type].map(c=>({c,v:map[c.id]||0})).sort((a,b)=>b.v-a.v);
    if(!total) return `<div class="none">Bu davrda ${type==="in"?"kirim":"chiqim"} yo'q.</div>`;
    const max=rows[0].v||1;
    return rows.map((r,i)=>`<div class="rank"><span class="n">${i+1}</span><span class="nm">${r.c.icon} ${r.c.name}</span>
      <span class="v num">${fmt(r.v)}<span class="p">${Math.round(r.v/total*100)}%</span></span>
      <span class="bar"><i style="width:${r.v/max*100}%;background:var(${r.c.c})"></i></span></div>`).join("");
  }
  function renderStats(){
    document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p===pkind));
    const r=range(pkind,poff), s=sums(r), p=sums(range(pkind,poff-1));
    $("#p-label").textContent=label(pkind,r);
    $("#p-next").disabled=poff>=0;
    $("#s-in").textContent=short(s.inc); $("#s-out").textContent=short(s.out);
    $("#s-bal").textContent=(s.bal<0?"−":"")+short(Math.abs(s.bal));
    $("#s-bal").className="num "+(s.bal>=0?"up":"down");
    $("#s-in-d").innerHTML=delta(s.inc,p.inc,true);
    $("#s-out-d").innerHTML=delta(s.out,p.out,false);
    $("#s-bal-d").innerHTML=delta(s.bal,p.bal,true);
    $("#r-in").innerHTML=rankHTML("in",s.bi,s.inc);
    $("#r-out").innerHTML=rankHTML("out",s.bo,s.out);
    // so'nggi 6 davr
    $("#trend-title").textContent=pkind==="month"?"So'nggi 6 oy":"So'nggi 6 hafta";
    const per=[]; for(let k=5;k>=0;k--){const rr=range(pkind,poff-k); per.push({r:rr,s:sums(rr),cur:k===0})}
    const max=Math.max(1,...per.map(x=>Math.max(x.s.inc,x.s.out)));
    $("#chart").innerHTML=per.map(x=>`<div class="col${x.cur?" cur":""}" title="${label(pkind,x.r)}: +${fmt(x.s.inc)} / −${fmt(x.s.out)}">
      <div class="bars"><i style="height:${x.s.inc/max*100}%;background:var(--in)"></i><i style="height:${x.s.out/max*100}%;background:var(--out)"></i></div>
      <small>${label(pkind,x.r,true)}</small></div>`).join("");
    const withData=per.filter(x=>x.s.inc||x.s.out);
    if(withData.length>1){
      const best=withData.reduce((a,b)=>b.s.bal>a.s.bal?b:a), worst=withData.reduce((a,b)=>b.s.out>a.s.out?b:a);
      $("#best").innerHTML=`Eng foydali ${pkind==="month"?"oy":"hafta"}: <b>${label(pkind,best.r)}</b> (${best.s.bal>=0?"+":"−"}${short(Math.abs(best.s.bal))})<br>Eng ko'p xarajat: <b>${label(pkind,worst.r)}</b> (${short(worst.s.out)})`;
    } else $("#best").textContent="Reyting uchun kamida 2 davrlik ma'lumot kerak.";
  }
  document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{pkind=b.dataset.p;poff=0;renderStats()}));
  $("#p-prev").addEventListener("click",()=>{poff--;renderStats()});
  $("#p-next").addEventListener("click",()=>{if(poff<0){poff++;renderStats()}});

  // ---------- Bo'limlar ----------
  let view="home";
  function show(v){
    view=v; $("#v-home").hidden=v!=="home"; $("#v-stats").hidden=v!=="stats";
    document.querySelectorAll(".tabbar .t").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
    render(); window.scrollTo(0,0);
  }
  document.querySelectorAll(".tabbar .t").forEach(b=>b.addEventListener("click",()=>show(b.dataset.v)));
  const render=()=>{ view==="home"?renderHome():renderStats() };

  // ---------- Forma ----------
  let ftype="in", fcat=null, editId=null;
  function drawCats(){
    $("#cat-lab").textContent=ftype==="in"?"Qayerdan keldi?":"Qayerga ketdi?";
    $("#cats").innerHTML=CATS[ftype].map(c=>`<button type="button" class="cat" style="--c:var(${c.c})" data-c="${c.id}" aria-pressed="${c.id===fcat}"><em>${c.icon}</em>${c.name}</button>`).join("");
    document.querySelectorAll(".type button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===ftype));
  }
  function openSheet(it){
    editId=it?it.id:null; ftype=it?it.type:"in"; fcat=it?it.cat:null;
    $("#f-amt").value=it?fmt(it.amount):""; $("#f-date").value=it?it.date:ymd(new Date()); $("#f-note").value=it?it.note||"":"";
    $("#f-del").hidden=!it; $("#f-err").textContent=""; delArmed=false; $("#f-del").textContent="O'chirish";
    drawCats(); $("#scrim").hidden=false; $("#sheet").hidden=false;
    if(!it) setTimeout(()=>$("#f-amt").focus(),80);
  }
  function close(){ $("#scrim").hidden=true; $("#sheet").hidden=true; editId=null }
  $("#add").addEventListener("click",()=>openSheet(null));
  $("#f-cancel").addEventListener("click",close);
  $("#scrim").addEventListener("click",close);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("#sheet").hidden) close() });
  document.querySelectorAll(".type button").forEach(b=>b.addEventListener("click",()=>{ if(ftype!==b.dataset.t){ ftype=b.dataset.t; if(!CATS[ftype].some(c=>c.id===fcat)) fcat=null; drawCats() } }));
  $("#cats").addEventListener("click",e=>{const b=e.target.closest(".cat"); if(!b) return; fcat=b.dataset.c; drawCats(); $("#f-err").textContent=""});
  $("#f-amt").addEventListener("input",e=>{
    const digits=e.target.value.replace(/\D/g,"").replace(/^0+/,"").slice(0,13);
    e.target.value=digits?fmt(Number(digits)):"";
  });
  let delArmed=false;
  $("#f-del").addEventListener("click",()=>{
    if(!delArmed){ delArmed=true; $("#f-del").textContent="Aniqmi?"; return }
    items=items.filter(x=>x.id!==editId); save(); close(); render(); toast("O'chirildi");
  });
  $("#sheet").addEventListener("submit",e=>{
    e.preventDefault();
    const amount=Number($("#f-amt").value.replace(/\D/g,""));
    if(!amount){ $("#f-err").textContent="Summani kiriting."; return }
    if(!fcat){ $("#f-err").textContent=ftype==="in"?"Daromad manbasini tanlang.":"Xarajat turini tanlang."; return }
    const date=$("#f-date").value||ymd(new Date());
    const old=items.find(x=>x.id===editId);
    const it={id:old?old.id:"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:ftype,cat:fcat,amount,date,note:$("#f-note").value.trim(),created:old?old.created:Date.now()};
    if(old) items[items.indexOf(old)]=it; else items.push(it);
    save(); close(); render();
    toast(old?"Saqlandi":`${ftype==="in"?"+":"−"}${fmt(amount)} · ${catOf(ftype,fcat).name}`);
  });

  let tt; function toast(m){ const el=$("#toast"); el.textContent=m; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,2200) }

  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) render() });
  render();
})();
</script>
</body>
</html>
